<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
    <!-- Custom Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Merienda:wght@300..900&family=Princess+Sofia&display=swap"
      rel="stylesheet"
    />
    <!-- Personal -->
    <link rel="stylesheet" href="style.css" />
    <script src="slider.js" defer></script>
    <title>Accessibility Tidbits || Filters</title>
  </head>

  <body>
    <header class="primary-header flex">
      <!-- column reverse -->
      <h1>Tidbits on <br /><span> Filters</span></h1>
      <nav class="primary-nav">
        <ul class="nav-list flex">
          <li>
            <a class="link-background" href="index.html">User Preference</a>
          </li>
          <li>
            <a class="link-background" href="hover.html">Hover & Animation</a>
          </li>
          <li>
            <a class="link-background" href="post.html">Drag & Drop</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="p-4">
      <section class="filter-container flex">
        <div>
          <header>
            <h2>Filters!</h2>
          </header>
        </div>
        <ul class="filter-list">
          <li>
            <img
              class="filter-card"
              id="grayscale-example"
              src="hedgehog.webp"
              alt="grayscale filter hedgehog"
            />
          </li>
          <li>
            <img
              class="filter-card"
              id="invert-example"
              src="hedgehog.webp"
              alt="invert filter hedgehog"
            />
          </li>
          <li>
            <img
              class="filter-card"
              id="contrast-example"
              src="hedgehog.webp"
              alt="contrast filter hedgehog"
            />
          </li>
          <li>
            <img
              class="filter-card"
              id="blur-example"
              src="hedgehog.webp"
              alt="blur filter hedgehog"
            />
          </li>
        </ul>
      </section>
      <section>
        <header>
          <h2>Now You Give It A Try</h2>
        </header>
        <ul class="filter-adjust-list grid">
          <li>
            <figure class="filter-card-wrapper">
              <figcaption>
                <label for="grayscale-adjust">Grayscale</label>
                <input
                  class="adjust-input"
                  name="grayscale"
                  id="grayscale-adjust"
                  data-name="grayscale"
                  data-type="%"
                  type="range"
                />
              </figcaption>
              <img
                class="filter-adjust"
                id="grayscale"
                src="hedgehog.webp"
                alt="adjustable grayscale filter hedgehog"
              />
            </figure>
          </li>
          <li>
            <figure class="filter-card-wrapper">
              <figcaption>
                <label for="hue-rotate-adjust">Hue-rotate</label>
                <input
                  class="adjust-input"
                  name="hue-rotate"
                  id="hue-rotate-adjust"
                  data-name="hue-rotate"
                  data-type="deg"
                  type="range"
                />
              </figcaption>
              <img
                class="filter-adjust"
                id="hue-rotate"
                src="hedgehog.webp"
                alt="adjustable hue-rotate filter hedgehog"
              />
            </figure>
          </li>
          <li>
            <figure class="filter-card-wrapper">
              <figcaption>
                <label for="blur-adjust">Blur</label>
                <input
                  class="adjust-input"
                  name="blur"
                  id="blur-adjust"
                  data-name="blur"
                  data-type="px"
                  type="range"
                />
              </figcaption>
              <img
                class="filter-adjust"
                id="blur"
                src="hedgehog.webp"
                alt="adjustable blur filter hedgehog"
              />
            </figure>
          </li>
          <li>
            <figure class="filter-card-wrapper">
              <figcaption>
                <label for="invert-adjust">Invert</label>
                <input
                  class="adjust-input"
                  name="invert"
                  id="invert-adjust"
                  data-type="%"
                  data-name="invert"
                  type="range"
                />
              </figcaption>
              <img
                class="filter-adjust"
                id="invert"
                src="hedgehog.webp"
                alt="adjustable invert filter hedgehog"
              />
            </figure>
          </li>
          <li>
            <figure class="filter-card-wrapper">
              <figcaption>
                <label for="opacity-adjust">Opacity</label>
                <input
                  class="adjust-input"
                  name="opacity"
                  id="opacity-adjust"
                  data-type="%"
                  data-name="opacity"
                  type="range"
                />
              </figcaption>
              <img
                class="filter-adjust"
                id="opacity"
                src="hedgehog.webp"
                alt="adjustable opacity filter hedgehog"
              />
            </figure>
          </li>
        </ul>
      </section>
    </main>
    <footer class="primary-footer">
      <div class="primary-image background-image header-image"></div>
      <small
        >Designed by
        <a href="https://github.com/stellRC" class="link-background"
          >StellRC</a
        ></small
      >
    </footer>
  </body>
</html>
